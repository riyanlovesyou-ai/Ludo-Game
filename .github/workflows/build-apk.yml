name: Build Ludo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip

      - name: Extract Game Project
        run: |
          mkdir source
          unzip Game_Ludo_Host_GitHub_Build.zip -d source

      - name: Build APK
        run: |
          ./gradle-8.9/bin/gradle -p source assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Game-APK
          path: source/app/build/outputs/apk/debug/*.apk
